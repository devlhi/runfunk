<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17131F"/>
      <stop offset="50%" stop-color="#221C2D"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF4A1C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4A1C"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3348"/>
      <stop offset="100%" stop-color="#17131F"/>
    </linearGradient>
    <linearGradient id="goldTag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle pattern grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Golden Glow behind Bike -->
  <circle cx="420" cy="270" r="220" fill="url(#goldGlow)"/>

  <!-- Sunburst / Star Rays Effect -->
  <g stroke="#FFB020" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="8 8">
    <line x1="420" y1="50" x2="420" y2="490"/>
    <line x1="200" y1="270" x2="640" y2="270"/>
    <line x1="264" y1="114" x2="576" y2="426"/>
    <line x1="264" y1="426" x2="576" y2="114"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="420" cy="410" rx="260" ry="20" fill="#000000" opacity="0.4"/>

  <!-- BICYCLE GRAPHIC -->
  <g transform="translate(120, 90)">

    <!-- Rear Wheel -->
    <circle cx="120" cy="240" r="90" fill="none" stroke="url(#wheelGrad)" stroke-width="18"/>
    <circle cx="120" cy="240" r="82" fill="none" stroke="#FFB020" stroke-width="3"/>
    <circle cx="120" cy="240" r="16" fill="#FFB020"/>
    <!-- Spokes Rear -->
    <g stroke="#E8F6F2" stroke-width="1.5" opacity="0.6">
      <line x1="120" y1="150" x2="120" y2="330"/>
      <line x1="30" y1="240" x2="210" y2="240"/>
      <line x1="56" y1="176" x2="184" y2="304"/>
      <line x1="56" y1="304" x2="184" y2="176"/>
      <line x1="84" y1="157" x2="156" y2="323"/>
      <line x1="156" y1="157" x2="84" y2="323"/>
    </g>

    <!-- Front Wheel -->
    <circle cx="480" cy="240" r="90" fill="none" stroke="url(#wheelGrad)" stroke-width="18"/>
    <circle cx="480" cy="240" r="82" fill="none" stroke="#FFB020" stroke-width="3"/>
    <circle cx="480" cy="240" r="16" fill="#FFB020"/>
    <!-- Spokes Front -->
    <g stroke="#E8F6F2" stroke-width="1.5" opacity="0.6">
      <line x1="480" y1="150" x2="480" y2="330"/>
      <line x1="390" y1="240" x2="570" y2="240"/>
      <line x1="416" y1="176" x2="544" y2="304"/>
      <line x1="416" y1="304" x2="544" y2="176"/>
      <line x1="444" y1="157" x2="516" y2="323"/>
      <line x1="516" y1="157" x2="444" y2="323"/>
    </g>

    <!-- Chainstay & Seatstay -->
    <line x1="120" y1="240" x2="240" y2="240" stroke="#E8F6F2" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="240" x2="210" y2="120" stroke="#E8F6F2" stroke-width="8" stroke-linecap="round"/>

    <!-- Main Frame (Triangles) -->
    <!-- Down Tube -->
    <line x1="240" y1="240" x2="430" y2="110" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Top Tube -->
    <line x1="210" y1="120" x2="410" y2="110" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Seat Tube -->
    <line x1="240" y1="240" x2="200" y2="90" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Front Fork -->
    <line x1="480" y1="240" x2="430" y2="80" stroke="#E8F6F2" stroke-width="10" stroke-linecap="round"/>
    <!-- Handlebar Stem & Bar -->
    <line x1="430" y1="80" x2="425" y2="60" stroke="#FFB020" stroke-width="8" stroke-linecap="round"/>
    <path d="M 400 55 L 435 60 L 460 70" fill="none" stroke="#FF4A1C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Saddle Post & Seat -->
    <line x1="200" y1="90" x2="195" y2="70" stroke="#E8F6F2" stroke-width="8"/>
    <path d="M 160 68 C 170 65, 220 65, 225 75 C 225 80, 210 82, 195 82 Z" fill="#FF4A1C" stroke="#17131F" stroke-width="3"/>

    <!-- Crankset & Pedal -->
    <circle cx="240" cy="240" r="28" fill="#17131F" stroke="#FFB020" stroke-width="4"/>
    <line x1="240" y1="240" x2="220" y2="280" stroke="#E8F6F2" stroke-width="6" stroke-linecap="round"/>
    <rect x="208" y="276" width="24" height="10" rx="3" fill="#FFB020"/>

    <!-- Chain -->
    <path d="M 120 240 L 240 268 L 240 212 Z" fill="none" stroke="#FFB020" stroke-width="2.5" stroke-dasharray="4 3"/>

    <!-- Disc Brakes & Accents -->
    <circle cx="120" cy="240" r="32" fill="none" stroke="#E8F6F2" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="480" cy="240" r="32" fill="none" stroke="#E8F6F2" stroke-width="3" stroke-dasharray="6 4"/>
  </g>

  <!-- DECORATIVE BADGES & TEXT OVERLAYS -->
  <!-- Top Left Ribbon Tag -->
  <g transform="translate(40, 36)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="42" rx="21" fill="#FF4A1C" stroke="#17131F" stroke-width="3"/>
    <text x="120" y="26" font-family="'Space Mono', monospace" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">★ GRAND DOORPRIZE</text>
  </g>

  <!-- Top Right Total Badge -->
  <g transform="translate(520, 36)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="42" rx="21" fill="url(#goldTag)" stroke="#17131F" stroke-width="3"/>
    <text x="120" y="26" font-family="'Space Mono', monospace" font-weight="700" font-size="14" fill="#17131F" text-anchor="middle" letter-spacing="1">TOTAL PULUHAN JUTA</text>
  </g>

  <!-- Bottom Banner Overlay -->
  <g transform="translate(180, 410)" filter="url(#shadow)">
    <rect x="0" y="0" width="440" height="54" rx="14" fill="#17131F" stroke="#FFB020" stroke-width="3"/>
    <text x="220" y="34" font-family="'Big Shoulders Display', sans-serif" font-weight="900" font-size="24" fill="#FFB020" text-anchor="middle" letter-spacing="2">HADIAH UTAMA SEPEDA &amp; DOORPRIZE</text>
  </g>

  <!-- Sparkles -->
  <path d="M 120 140 L 125 155 L 140 160 L 125 165 L 120 180 L 115 165 L 100 160 L 115 155 Z" fill="#FFB020"/>
  <path d="M 680 180 L 684 192 L 696 196 L 684 200 L 680 212 L 676 200 L 664 196 L 676 192 Z" fill="#FF4A1C"/>
  <path d="M 710 320 L 713 328 L 721 331 L 713 334 L 710 342 L 707 334 L 699 331 L 707 328 Z" fill="#0FB07E"/>
  <path d="M 90 320 L 93 328 L 101 331 L 93 334 L 90 342 L 87 334 L 79 331 L 87 328 Z" fill="#FFB020"/>
</svg>